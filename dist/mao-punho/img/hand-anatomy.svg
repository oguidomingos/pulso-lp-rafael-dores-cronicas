      <ellipse cx="180" cy="412" rx="22" ry="18" />
      <ellipse cx="225" cy="412" rx="20" ry="18" />
      <ellipse cx="268" cy="412" rx="22" ry="18" />
      <ellipse cx="310" cy="416" rx="20" ry="18" />
    </g>
    <!-- Metacarpais (5) -->
    <path d="M150 430 C 110 480 90 540 75 600" />
    <path d="M190 432 C 175 510 168 590 160 660" />
    <path d="M235 432 C 232 510 230 590 228 660" />
    <path d="M280 432 C 285 510 290 590 295 660" />
    <path d="M322 430 C 332 510 342 590 352 660" />
    <!-- Falanges proximais -->
    <g>
      <ellipse cx="70" cy="618" rx="22" ry="14" />
      <ellipse cx="160" cy="680" rx="18" ry="22" />
      <ellipse cx="228" cy="680" rx="18" ry="22" />
      <ellipse cx="295" cy="680" rx="18" ry="22" />
      <ellipse cx="355" cy="680" rx="18" ry="22" />
    </g>
    <!-- Falanges medias -->
    <g opacity="0.85">
      <ellipse cx="45" cy="660" rx="20" ry="13" />
      <ellipse cx="158" cy="725" rx="16" ry="18" />
      <ellipse cx="225" cy="725" rx="16" ry="18" />
      <ellipse cx="295" cy="725" rx="16" ry="18" />
      <ellipse cx="358" cy="725" rx="16" ry="18" />
    </g>
    <!-- Falanges distais -->
    <g opacity="0.75">
      <ellipse cx="155" cy="760" rx="14" ry="14" />
      <ellipse cx="223" cy="760" rx="14" ry="14" />
      <ellipse cx="295" cy="760" rx="14" ry="14" />
      <ellipse cx="360" cy="760" rx="14" ry="14" />
    </g>
    <!-- Túnel do carpo (silhueta) -->
    <path d="M150 390 C 200 405 280 405 320 390" opacity="0.4" stroke-dasharray="2 4" />
    <!-- Articulação do punho -->
    <path d="M150 350 C 200 360 290 360 325 350" opacity="0.5" />
