      <ellipse cx="170" cy="370" rx="22" ry="18" />
      <ellipse cx="215" cy="368" rx="20" ry="18" />
      <ellipse cx="258" cy="370" rx="20" ry="18" />
      <ellipse cx="298" cy="378" rx="18" ry="16" opacity="0.8" />
    </g>
    <!-- Carpais (linha distal: trapezio, trapezoide, capitato, hamato) -->
