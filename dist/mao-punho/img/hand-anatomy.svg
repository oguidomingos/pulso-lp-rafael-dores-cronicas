<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <g opacity="0.95">
    <!-- Rádio e ulna -->
    <path d="M150 30 C 165 130 175 230 195 340" />
    <path d="M210 30 C 215 130 220 230 230 340" opacity="0.7" />
    <path d="M270 30 C 270 130 275 230 280 340" />
    <path d="M310 30 C 310 130 315 230 320 340" opacity="0.7" />
    <!-- Carpais (linha proximal: escafoide, semilunar, piramidal, pisiforme) -->
